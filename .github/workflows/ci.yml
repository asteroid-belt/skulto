name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: bin
          key: golangci-lint-v2.7.2

      - name: Install dependencies
        run: make deps

      - name: Run linter
        run: make lint

      - name: Run tests with coverage
        run: make test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage summary
        run: |
          # Extract total coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Coverage: ${COVERAGE}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Breakdown" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | head -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install nFPM
        run: |
          NFPM_VERSION=2.47.0
          NFPM_BIN_DIR="$RUNNER_TEMP/nfpm/bin"
          mkdir -p "$NFPM_BIN_DIR"
          GOBIN="$NFPM_BIN_DIR" GOTOOLCHAIN=go1.26.8 \
            go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}"
          echo "$NFPM_BIN_DIR" >> "$GITHUB_PATH"

      - name: Build Linux package fixtures
        env:
          SKULTO_POSTHOG_API_KEY: test
        run: |
          GOOS=linux GOARCH=amd64 VERSION=v0.0.0-ci make release
          GOOS=linux GOARCH=arm64 VERSION=v0.0.0-ci make release

      - name: Verify Linux packages
        run: bash scripts/test-linux-packages.sh
